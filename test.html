<section id="ghl-product-showcase">
  <style>
    #ghl-product-showcase {
      --bg: #f7f8fc;
      --surface: #ffffff;
      --surface-2: #f1f4fb;
      --text: #101828;
      --muted: #667085;
      --line: #e4e7ec;
      --primary: #85688f;
      --primary-2: #85688f;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 12px;
      --container: 1280px;
      background: #F1EFF4;
      padding: 48px 16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    #ghl-product-showcase * {
      box-sizing: border-box;
    }

    #ghl-product-showcase .ghl-wrap {
      max-width: var(--container);
      margin: 0 auto;
    }

    #ghl-product-showcase .ghl-panel {
      background: #F1EFF4;
      height: 100%;
      overflow: hidden;
    }

    #ghl-product-showcase .ghl-toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    #ghl-product-showcase .ghl-select {
      width: 100%;
      height: 52px;
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 14px;
      padding: 0 16px;
      outline: none;
      color: var(--text);
      font-size: 14px;
      transition: 0.25s ease;
      appearance: none;
      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.04),
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    #ghl-product-showcase .ghl-select:focus {
      border-color: rgba(109, 94, 252, 0.55);
      box-shadow: 0 0 0 4px rgba(109, 94, 252, 0.12);
    }

    #ghl-product-showcase .ghl-field {
      position: relative;
    }

    #ghl-product-showcase .ghl-field.select-wrap::after {
      content: "▾";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #98a2b3;
      font-size: 14px;
      pointer-events: none;
    }

    #ghl-product-showcase .ghl-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 0;
      flex-wrap: wrap;
    }

    #ghl-product-showcase .ghl-results {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    #ghl-product-showcase .ghl-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      padding: 18px;
    }

    #ghl-product-showcase .ghl-card {
      background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
      border: 1px solid #edf0f5;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.05);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      text-decoration: none;
    }

    #ghl-product-showcase .ghl-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 34px rgba(16, 24, 40, 0.10);
      border-color: rgba(109, 94, 252, 0.18);
    }

    #ghl-product-showcase .ghl-image-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      background:
        radial-gradient(circle at top, rgba(109, 94, 252, 0.14), transparent 32%),
        linear-gradient(180deg, #f9fafb, #eff3fa);
      overflow: hidden;
    }

    #ghl-product-showcase .ghl-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }

    #ghl-product-showcase .ghl-card:hover .ghl-image-wrap img {
      transform: scale(1.05);
    }

    #ghl-product-showcase .ghl-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: var(--primary);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.08);
      max-width: calc(100% - 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #ghl-product-showcase .ghl-body {
      padding: 16px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    #ghl-product-showcase .ghl-name {
      font-size: 17px;
      line-height: 1.35;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 46px;
    }

    #ghl-product-showcase .ghl-desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 43px;
    }

    #ghl-product-showcase .ghl-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
    }

    #ghl-product-showcase .ghl-price {
      font-size: 24px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #0f172a;
    }

    #ghl-product-showcase .ghl-btn {
      appearance: none;
      border: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      border-radius: 14px;
      height: 46px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(109, 94, 252, 0.24);
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
    }

    #ghl-product-showcase .ghl-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(109, 94, 252, 0.3);
    }

    #ghl-product-showcase .ghl-pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 18px 18px;
    }

    #ghl-product-showcase .ghl-pagination-info {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    #ghl-product-showcase .ghl-pagination-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #ghl-product-showcase .ghl-page-btn {
      min-width: 42px;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    #ghl-product-showcase .ghl-page-btn:hover:not(:disabled) {
      border-color: rgba(109, 94, 252, 0.24);
      color: var(--primary);
      background: rgba(109, 94, 252, 0.05);
    }

    #ghl-product-showcase .ghl-page-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 12px 24px rgba(109, 94, 252, 0.2);
    }

    #ghl-product-showcase .ghl-page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #ghl-product-showcase .ghl-empty,
    #ghl-product-showcase .ghl-error {
      padding: 44px 18px;
      text-align: center;
      color: var(--muted);
    }

    #ghl-product-showcase .ghl-empty strong,
    #ghl-product-showcase .ghl-error strong {
      display: block;
      font-size: 20px;
      color: var(--text);
      margin-bottom: 8px;
    }

    #ghl-product-showcase .ghl-skeleton {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      padding: 18px;
    }

    #ghl-product-showcase .ghl-skeleton-card {
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #edf0f5;
    }

    #ghl-product-showcase .ghl-skeleton-img,
    #ghl-product-showcase .ghl-skeleton-line {
      background: linear-gradient(90deg, #eef2f7 25%, #f7f9fc 37%, #eef2f7 63%);
      background-size: 400% 100%;
      animation: ghlShimmer 1.4s ease infinite;
    }

    #ghl-product-showcase .ghl-skeleton-img {
      aspect-ratio: 1 / 1;
    }

    #ghl-product-showcase .ghl-skeleton-body {
      padding: 16px;
    }

    #ghl-product-showcase .ghl-skeleton-line {
      height: 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    @keyframes ghlShimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: 0 0;
      }
    }

    @media (max-width: 1100px) {

      #ghl-product-showcase .ghl-grid,
      #ghl-product-showcase .ghl-skeleton {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      #ghl-product-showcase .ghl-toolbar {
        grid-template-columns: 1fr;
      }

      #ghl-product-showcase .ghl-grid,
      #ghl-product-showcase .ghl-skeleton {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      #ghl-product-showcase {
        padding: 30px 12px;
      }

      #ghl-product-showcase .ghl-grid,
      #ghl-product-showcase .ghl-skeleton {
        grid-template-columns: 1fr;
      }

      #ghl-product-showcase .ghl-pagination {
        flex-direction: column;
        align-items: stretch;
      }

      #ghl-product-showcase .ghl-pagination-controls {
        justify-content: center;
      }
    }
  </style>

  <div class="ghl-wrap">
    <div class="ghl-panel">
      <div class="ghl-toolbar">
        <div class="ghl-field select-wrap">
          <select id="ghlCategory" class="ghl-select">
            <option value="all">All Categories</option>
          </select>
        </div>

        <div class="ghl-field select-wrap">
          <select id="ghlSort" class="ghl-select">
            <option value="priority-desc">Featured</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="name-desc">Name: Z to A</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="newest-desc">Newest</option>
            <option value="oldest-asc">Oldest</option>
          </select>
        </div>
      </div>

      <div class="ghl-meta">
        <div id="ghlResults" class="ghl-results">Loading products...</div>
      </div>

      <div id="ghlContent">
        <div class="ghl-skeleton">
          <div class="ghl-skeleton-card">
            <div class="ghl-skeleton-img"></div>
            <div class="ghl-skeleton-body">
              <div class="ghl-skeleton-line"></div>
              <div class="ghl-skeleton-line" style="width:70%;"></div>
              <div class="ghl-skeleton-line" style="width:40%; margin-top:18px;"></div>
            </div>
          </div>
          <div class="ghl-skeleton-card">
            <div class="ghl-skeleton-img"></div>
            <div class="ghl-skeleton-body">
              <div class="ghl-skeleton-line"></div>
              <div class="ghl-skeleton-line" style="width:70%;"></div>
              <div class="ghl-skeleton-line" style="width:40%; margin-top:18px;"></div>
            </div>
          </div>
          <div class="ghl-skeleton-card">
            <div class="ghl-skeleton-img"></div>
            <div class="ghl-skeleton-body">
              <div class="ghl-skeleton-line"></div>
              <div class="ghl-skeleton-line" style="width:70%;"></div>
              <div class="ghl-skeleton-line" style="width:40%; margin-top:18px;"></div>
            </div>
          </div>
          <div class="ghl-skeleton-card">
            <div class="ghl-skeleton-img"></div>
            <div class="ghl-skeleton-body">
              <div class="ghl-skeleton-line"></div>
              <div class="ghl-skeleton-line" style="width:70%;"></div>
              <div class="ghl-skeleton-line" style="width:40%; margin-top:18px;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="ghl-pagination" id="ghlPagination" style="display:none;">
        <div id="ghlPaginationInfo" class="ghl-pagination-info"></div>
        <div id="ghlPaginationControls" class="ghl-pagination-controls"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const API_URL = "https://backend.leadconnectorhq.com/products/public?locationId=De8rI8znhXkZ638cZqKe&storeId=vhPvUUAxqPmdDnTW5BW7&sendWishlistStatus=false&sortField=displayPriority&sortOrder=desc";

      const state = {
        allProducts: [],
        filteredProducts: [],
        page: 1,
        perPage: 12,
        category: "all",
        sort: "priority-desc"
      };

      const els = {
        category: document.getElementById("ghlCategory"),
        sort: document.getElementById("ghlSort"),
        content: document.getElementById("ghlContent"),
        results: document.getElementById("ghlResults"),
        pagination: document.getElementById("ghlPagination"),
        paginationInfo: document.getElementById("ghlPaginationInfo"),
        paginationControls: document.getElementById("ghlPaginationControls")
      };

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function slugify(value) {
        return String(value || "")
          .toLowerCase()
          .trim()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function currencyFormat(value) {
        const num = Number(value || 0);
        if (Number.isNaN(num)) return "$0.00";

        try {
          return new Intl.NumberFormat(undefined, {
            style: "currency",
            currency: "USD",
            maximumFractionDigits: 2
          }).format(num);
        } catch (e) {
          return "$" + num.toFixed(2);
        }
      }

      function pickFirstImage(product) {
        const sources = [
          product.images,
          product.image,
          product.featuredImage,
          product.media,
          product.photos
        ];

        for (const source of sources) {
          if (Array.isArray(source) && source.length) {
            const first = source[0];
            if (typeof first === "string") return first;
            if (first && typeof first === "object") {
              return first.url || first.src || first.image || first.imageUrl || "";
            }
          }

          if (typeof source === "string" && source) return source;
        }

        return "https://placehold.co/800x800/f5f7fb/98a2b3?text=Product";
      }

      function productName(product) {
        return product.name || product.title || product.productName || product.label || "Untitled Product";
      }

      function productDescription(product) {
        return String(
          product.description ||
          product.shortDescription ||
          product.productDescription ||
          ""
        ).replace(/<[^>]*>/g, "").trim();
      }

      function productCategory(product) {
        const cat =
          product.category?.name ||
          product.category ||
          product.productType ||
          product.collection ||
          product.type ||
          product.productCategory ||
          "General";

        return typeof cat === "string" ? cat : "General";
      }

      function productPrice(product) {
        return (
          product.price ??
          product.amount ??
          product.sellingPrice ??
          product.compareAtPrice ??
          product.variants?.[0]?.price ??
          product.variants?.[0]?.amount ??
          0
        );
      }

      function productCreatedAt(product) {
        return product.createdAt || product.created_at || product.dateCreated || product.updatedAt || 0;
      }

      function productPriority(product) {
        return product.displayPriority ?? product.priority ?? 0;
      }

      const PDP_BASE_URL = window.location.hostname.includes("app.gohighlevel.com")
        ? "https://app.gohighlevel.com/v2/preview/76EHJp4ffsLfP2RtuE6C"
        : window.location.origin;

      function productLink(product) {
        const slug =
          product.slug ||
          product.handle ||
          product.seo?.handle ||
          product.urlSlug ||
          "";

        if (!slug) return "#";

        return PDP_BASE_URL + "/product/" + String(slug).replace(/^\/+|\/+$/g, "");
      }

      function cryptoRandomId() {
        return "p_" + Math.random().toString(36).slice(2, 11);
      }

      function normalizeProduct(product) {
        const categoryName = productCategory(product);

        return {
          raw: product,
          id: product._id || product.id || cryptoRandomId(),
          name: productName(product),
          description: productDescription(product),
          category: categoryName,
          categorySlug: slugify(categoryName),
          price: Number(productPrice(product) || 0),
          image: pickFirstImage(product),
          createdAt: productCreatedAt(product),
          priority: Number(productPriority(product) || 0),
          link: productLink(product)
        };
      }

      function parseProductsFromResponse(json) {
        if (Array.isArray(json)) return json;
        if (Array.isArray(json.products)) return json.products;
        if (Array.isArray(json.data)) return json.data;
        if (Array.isArray(json.items)) return json.items;
        if (json.data && Array.isArray(json.data.products)) return json.data.products;
        return [];
      }

      async function fetchProducts() {
        const res = await fetch(API_URL, {
          method: "GET",
          headers: {
            Accept: "application/json"
          }
        });

        if (!res.ok) {
          throw new Error("Failed to fetch products. Status: " + res.status);
        }

        const json = await res.json();
        return parseProductsFromResponse(json);
      }

      function getUrlState() {
        const params = new URLSearchParams(window.location.search);

        return {
          category: params.get("category") || "all",
          page: Math.max(1, parseInt(params.get("page") || "1", 10) || 1),
          sort: params.get("sort") || "priority-desc"
        };
      }

      function updateUrl() {
        const params = new URLSearchParams(window.location.search);

        if (state.category !== "all") params.set("category", state.category);
        else params.delete("category");

        if (state.page > 1) params.set("page", String(state.page));
        else params.delete("page");

        if (state.sort !== "priority-desc") params.set("sort", state.sort);
        else params.delete("sort");

        const newUrl = window.location.pathname + (params.toString() ? "?" + params.toString() : "");
        window.history.replaceState({}, "", newUrl);
      }

      function syncInputsFromState() {
        if (els.sort) els.sort.value = state.sort;
        if (els.category) els.category.value = state.category;
      }

      function buildCategoryOptions(products) {
        const categories = [...new Set(products.map(p => p.category).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b));

        const options = [{ label: "All Categories", value: "all" }]
          .concat(categories.map(cat => ({ label: cat, value: slugify(cat) })));

        if (els.category) {
          els.category.innerHTML = options.map(opt =>
            `<option value="${escapeHtml(opt.value)}">${escapeHtml(opt.label)}</option>`
          ).join("");
        }

        if (els.category && ![...els.category.options].some(opt => opt.value === state.category)) {
          state.category = "all";
        }

        syncInputsFromState();
      }

      function applyFiltersAndRender() {
        let items = [...state.allProducts];

        if (state.category !== "all") {
          items = items.filter(p => p.categorySlug === state.category);
        }

        const [sortField, sortDir] = state.sort.split("-");

        items.sort((a, b) => {
          let valA, valB;

          if (sortField === "name") {
            valA = a.name.toLowerCase();
            valB = b.name.toLowerCase();
            return sortDir === "asc" ? valA.localeCompare(valB) : valB.localeCompare(valA);
          }

          if (sortField === "price") {
            valA = Number(a.price || 0);
            valB = Number(b.price || 0);
            return sortDir === "asc" ? valA - valB : valB - valA;
          }

          if (sortField === "newest") {
            valA = new Date(a.createdAt || 0).getTime();
            valB = new Date(b.createdAt || 0).getTime();
            return valB - valA;
          }

          if (sortField === "oldest") {
            valA = new Date(a.createdAt || 0).getTime();
            valB = new Date(b.createdAt || 0).getTime();
            return valA - valB;
          }

          valA = Number(a.priority || 0);
          valB = Number(b.priority || 0);
          return sortDir === "asc" ? valA - valB : valB - valA;
        });

        state.filteredProducts = items;

        const totalPages = Math.max(1, Math.ceil(items.length / state.perPage));
        if (state.page > totalPages) state.page = totalPages;
        if (state.page < 1) state.page = 1;

        updateUrl();
        render();
      }

      function render() {
        const total = state.filteredProducts.length;
        const totalPages = Math.max(1, Math.ceil(total / state.perPage));
        const start = (state.page - 1) * state.perPage;
        const end = start + state.perPage;
        const paged = state.filteredProducts.slice(start, end);

        if (els.results) {
          els.results.textContent = total
            ? `${total} product${total > 1 ? "s" : ""} found`
            : "No products found";
        }

        if (!total) {
          els.content.innerHTML = `
            <div class="ghl-empty">
              <strong>No matching products</strong>
              <div>Try changing the category or sort option.</div>
            </div>
          `;
          if (els.pagination) els.pagination.style.display = "none";
          return;
        }

        els.content.innerHTML = `
          <div class="ghl-grid">
            ${paged.map(product => `
              <a href="${escapeHtml(product.link)}" class="ghl-card">
                <div class="ghl-image-wrap">
                  <img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}" loading="lazy">
                </div>
                <div class="ghl-body">
                  <h3 class="ghl-name">${escapeHtml(product.name)}</h3>
                  <p class="ghl-desc">${escapeHtml(product.description || "Premium quality product crafted to elevate your shopping experience.")}</p>
                  <div class="ghl-price-row">
                    <p class="ghl-btn" >View Product</p>
                  </div>
                </div>
              </a>
            `).join("")}
          </div>
        `;

        renderPagination(total, totalPages, start, end);
      }

      function renderPagination(total, totalPages, start, end) {
        if (!els.pagination || !els.paginationInfo || !els.paginationControls) return;

        els.pagination.style.display = totalPages > 1 ? "flex" : "none";
        els.paginationInfo.textContent = `Showing ${start + 1}-${Math.min(end, total)} of ${total}`;

        if (totalPages <= 1) {
          els.paginationControls.innerHTML = "";
          return;
        }

        const buttons = [];
        buttons.push(`<button class="ghl-page-btn" data-page="${state.page - 1}" ${state.page === 1 ? "disabled" : ""}>Prev</button>`);

        const pagesToShow = getPaginationWindow(state.page, totalPages, 5);

        if (pagesToShow[0] > 1) {
          buttons.push(`<button class="ghl-page-btn" data-page="1">1</button>`);
          if (pagesToShow[0] > 2) {
            buttons.push(`<button class="ghl-page-btn" disabled>…</button>`);
          }
        }

        pagesToShow.forEach(pageNum => {
          buttons.push(`<button class="ghl-page-btn ${pageNum === state.page ? "active" : ""}" data-page="${pageNum}">${pageNum}</button>`);
        });

        if (pagesToShow[pagesToShow.length - 1] < totalPages) {
          if (pagesToShow[pagesToShow.length - 1] < totalPages - 1) {
            buttons.push(`<button class="ghl-page-btn" disabled>…</button>`);
          }
          buttons.push(`<button class="ghl-page-btn" data-page="${totalPages}">${totalPages}</button>`);
        }

        buttons.push(`<button class="ghl-page-btn" data-page="${state.page + 1}" ${state.page === totalPages ? "disabled" : ""}>Next</button>`);

        els.paginationControls.innerHTML = buttons.join("");

        els.paginationControls.querySelectorAll("[data-page]").forEach(btn => {
          btn.addEventListener("click", function () {
            const newPage = Number(this.getAttribute("data-page"));
            if (!newPage || newPage < 1 || newPage > totalPages || newPage === state.page) return;

            state.page = newPage;
            updateUrl();
            render();

            const panel = document.getElementById("ghl-product-showcase");
            if (panel) panel.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        });
      }

      function getPaginationWindow(current, total, span) {
        let start = Math.max(1, current - Math.floor(span / 2));
        let end = Math.min(total, start + span - 1);

        if (end - start + 1 < span) {
          start = Math.max(1, end - span + 1);
        }

        const pages = [];
        for (let i = start; i <= end; i++) pages.push(i);
        return pages;
      }

      function bindEvents() {
        els.category?.addEventListener("change", function () {
          state.category = this.value || "all";
          state.page = 1;
          updateUrl();
          applyFiltersAndRender();
        });

        els.sort?.addEventListener("change", function () {
          state.sort = this.value || "priority-desc";
          state.page = 1;
          updateUrl();
          applyFiltersAndRender();
        });

        window.addEventListener("popstate", function () {
          const urlState = getUrlState();
          state.category = urlState.category;
          state.page = urlState.page;
          state.sort = urlState.sort;

          if (els.category && ![...els.category.options].some(opt => opt.value === state.category)) {
            state.category = "all";
          }

          syncInputsFromState();
          applyFiltersAndRender();
        });
      }

      async function init() {
        bindEvents();

        const urlState = getUrlState();
        state.category = urlState.category;
        state.page = urlState.page;
        state.sort = urlState.sort;

        syncInputsFromState();

        try {
          const rawProducts = await fetchProducts();
          state.allProducts = rawProducts.map(normalizeProduct);

          buildCategoryOptions(state.allProducts);
          applyFiltersAndRender();
        } catch (error) {
          console.error(error);
          els.content.innerHTML = `
            <div class="ghl-error">
              <strong>Unable to load products</strong>
              <div>Please check the endpoint, CORS access, or the returned product structure.</div>
            </div>
          `;
          if (els.pagination) els.pagination.style.display = "none";
          if (els.results) els.results.textContent = "Could not load products";
        }
      }

      init();
    })();
  </script>
</section>
